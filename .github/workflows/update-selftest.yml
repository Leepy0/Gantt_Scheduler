# 업데이트 자체 시험: 실제 배포 형태(런타임 포함)로 게시한 서버가 스스로 새 버전으로 바뀌고 되돌아오는지 확인한다.
# Windows 는 실행 중인 파일을 덮어쓸 수 없어 Linux 와 동작이 다르므로 두 곳에서 모두 돌린다.
name: 업데이트 자체 시험

on:
  push:
    branches: [main]
    paths:
      - 'src/GanttScheduler/Services/Update*.cs'
      - 'src/GanttScheduler/Services/*Service*.cs'
      - 'src/GanttScheduler/Program.cs'
      - 'src/GanttScheduler/Pages/Admin/Update*'
      - 'tools/release/**'
      - '.github/workflows/update-selftest.yml'
  workflow_dispatch:

concurrency:
  group: update-selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 운영 형태: Windows 서비스 (전용 계정, sc start 로 재시작)
          - os: windows-latest
            rid: win-x64
            mode: service
          - os: windows-latest
            rid: win-x64
            mode: direct
          - os: ubuntu-24.04
            rid: linux-x64
            mode: direct
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: 확인 → 받기 → 적용 → 되돌리기
        env:
          RID: ${{ matrix.rid }}
          MODE: ${{ matrix.mode }}
        run: WORK="$RUNNER_TEMP/selftest" tools/release/selftest.sh
