# push 마다: 빌드 → 테스트(SQLite) → SQL Server 마이그레이션·테스트 → 화면 점검(데스크톱·모바일 캡처)
# 결과(로그·캡처)는 preview 브랜치에 올린다. 휴대폰에서도 GitHub 로 바로 볼 수 있다.
# main 으로 가는 PR(Dependabot 패키지 올리기 등)에도 같은 검사를 돌려 PR 화면에 결과를 남긴다. PR 결과는 preview 에 올리지 않는다
# (preview 는 main 의 최신 상태를 보여 주는 곳이고, Dependabot PR 의 토큰은 쓰기 권한이 없다)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Gantt_Ci_2026!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # 패키지 캐시 (잠금 파일이 바뀔 때만 새로 받는다)
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: 준비
        run: |
          mkdir -p out/logs out/screens out/exports
          # PDF 내보내기와 화면 캡처에 쓸 한글 글꼴
          sudo apt-get install -y -qq --no-install-recommends fonts-nanum > /dev/null && fc-cache -f

      - name: 빌드
        id: build
        run: |
          set -o pipefail
          # 잠금 파일(packages.lock.json)과 다른 패키지가 들어오면 실패한다 (버전은 Directory.Packages.props 에 고정)
          dotnet restore GanttScheduler.slnx --locked-mode 2>&1 | tee out/logs/build.log
          dotnet build GanttScheduler.slnx -c Release --no-restore 2>&1 | tee -a out/logs/build.log

      - name: 테스트 (SQLite)
        id: test
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          dotnet test GanttScheduler.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee out/logs/test-sqlite.log

      - name: 테스트 (SQL Server, 마이그레이션 적용)
        id: sqlserver
        if: always() && steps.build.outcome == 'success' && hashFiles('src/GanttScheduler/Data/Migrations/*.cs') != ''
        env:
          TEST_DB: SqlServer
          TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Gantt_Ci_2026!;TrustServerCertificate=True"
        run: |
          set -o pipefail
          # SQL Server 컨테이너가 접속을 받을 때까지 대기
          for i in $(seq 1 60); do (echo > /dev/tcp/localhost/1433) 2>/dev/null && break; sleep 2; done
          sleep 10
          # DB 를 쓰지 않는 테스트(규칙 계산, 서비스 등록 명령, 업데이트 파일 처리)와 SQLite 전용 테스트는 위 단계에서 이미 돌았다.
          # 여기서는 DB 를 거치는 테스트만 다시 돌린다. 새 테스트 클래스는 기본으로 포함된다(빼도 되는 것만 여기 적는다)
          dotnet test GanttScheduler.slnx -c Release --no-build --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName!~GanttScheduler.Tests.RulesTests.&FullyQualifiedName!~GanttScheduler.Tests.ScheduleRulesTests.&FullyQualifiedName!~GanttScheduler.Tests.ServiceInstallerTests.&FullyQualifiedName!~GanttScheduler.Tests.UpdateTests.&FullyQualifiedName!~GanttScheduler.Tests.OpsTests.&FullyQualifiedName!~GanttScheduler.Tests.FileLogTests." \
            2>&1 | tee out/logs/test-sqlserver.log

      - name: 화면 점검 (데스크톱·모바일)
        id: e2e
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          cd e2e && npm install --no-audit --no-fund --silent && cd ..
          # 앱을 프로젝트 폴더에서 띄운다 (wwwroot·설정 파일 기준 경로)
          (cd src/GanttScheduler && ASPNETCORE_ENVIRONMENT=Development Database__SqlitePath=$RUNNER_TEMP/e2e.db \
            nohup dotnet bin/Release/net10.0/GanttScheduler.dll --urls http://localhost:5080 > ../../out/logs/app.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:5080/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5080/health > /dev/null || { echo "앱이 시작되지 않았습니다."; cat out/logs/app.log; exit 1; }
          # APP_LOG: 앱 로그의 경고·오류 줄을 화면 점검 보고서(report.md)에 요약해 넣는다
          PW_CHANNEL=chrome OUT_DIR=$PWD/out APP_LOG=$PWD/out/logs/app.log node e2e/run.cjs 2>&1 | tee out/logs/e2e.log

      - name: 결과를 preview 브랜치에 올리기
        if: always() && github.event_name != 'pull_request'
        env:
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          SQLSERVER: ${{ steps.sqlserver.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          label() { case "$1" in success) echo "통과";; failure) echo "**실패**";; *) echo "건너뜀";; esac; }
          cd out
          {
            echo "# 최신 빌드 미리보기"
            echo
            echo "- 커밋: \`${GITHUB_SHA::7}\` — $(git -C .. log -1 --pretty=%s)"
            echo "- 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (KST)"
            echo "- 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| 빌드 | $(label "$BUILD") |"
            echo "| 테스트 (SQLite) | $(label "$TEST") |"
            echo "| 테스트 (SQL Server·마이그레이션) | $(label "$SQLSERVER") |"
            echo "| 화면 점검 | $(label "$E2E") |"
            echo
            if [ -f report.md ]; then sed 's/^# /## /' report.md; echo; fi
            if ls exports/* > /dev/null 2>&1; then
              echo "## 내보내기 파일"; echo
              for f in exports/*; do echo "- [$(basename "$f")]($f)"; done
              echo
            fi
            if ls screens/fail-*.png > /dev/null 2>&1; then
              echo "## 실패한 단계의 화면"; echo
              for f in screens/fail-*.png; do echo "### $(basename "$f" .png)"; echo; echo "![]($f)"; echo; done
            fi
            if ls screens/m*.png > /dev/null 2>&1; then
              echo "## 모바일 화면"; echo
              for f in screens/m*.png; do echo "### $(basename "$f" .png)"; echo; echo "<img src=\"$f\" width=\"320\">"; echo; done
            fi
            if ls screens/d*.png > /dev/null 2>&1; then
              echo "## 데스크톱 화면"; echo
              for f in screens/d*.png; do echo "### $(basename "$f" .png)"; echo; echo "![]($f)"; echo; done
            fi
          } > README.md
          git init -q -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "미리보기: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview
