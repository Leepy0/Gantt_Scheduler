name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          dotnet --list-sdks
          google-chrome --version || true
          mkdir -p out && echo "probe $(date -u)" > out/probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out
