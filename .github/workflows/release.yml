# 배포 패키지: Windows x64, .NET 런타임 포함(zip). 서버의 자동 업데이트(관리 > 업데이트)가 받는 파일이다.
#   테스트 빌드 → CI 가 main 에서 성공하면 이 레포의 Release "dev"(prerelease) 덮어쓰기. 자동 업데이트 대상 아님
#   정식 배포   → Release "vX.Y.Z"(Latest) 를 이 레포와 공개 배포 레포(RELEASE_REPO) 두 곳에 만든다.
#                이 레포는 비공개라 서버가 읽을 수 없다. 서버는 공개 배포 레포의 릴리스만 본다.
#                공개 레포에 쓰려면 시크릿 RELEASE_REPO_TOKEN 이 필요하다 (README "새 버전 내보내기" 참고)
#                그 커밋의 CI(빌드·SQLite·SQL Server 테스트·화면 점검)가 성공해야 만든다
#     1) 태그 vX.Y.Z push, 또는
#     2) Actions 탭 › 배포 패키지 › Run workflow › '정식 배포' 체크 (csproj <Version> 으로 태그·릴리스 생성)
#   서명: 저장소에 공개키(src/GanttScheduler/update-key.pub)가 있으면 시크릿 RELEASE_SIGNING_KEY(개인키)로
#         매니페스트에 서명(GanttScheduler.json.sig)한다. 공개키가 있는데 시크릿이 없으면 정식 배포를 멈춘다
name: 배포 패키지

on:
  # 테스트 빌드는 CI 가 끝난 뒤에만 (실패한 커밋으로 dev 패키지를 만들지 않는다)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '정식 배포 (csproj <Version> 으로 vX.Y.Z 태그·릴리스 생성)'
        type: boolean
        default: false

# 정식 배포와 테스트 빌드는 그룹을 나눈다. 정식 배포 도중 main 에 push 해도(테스트 빌드가 돌아도) 정식 배포는 취소되지 않는다.
# 테스트 빌드끼리는 최신 것만 남기면 되므로 앞의 것을 취소한다
concurrency:
  group: release-${{ github.ref }}-${{ (startsWith(github.ref, 'refs/tags/') || inputs.release) && 'release' || 'dev' }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.release) }}

permissions:
  contents: write
  actions: read   # 그 커밋의 CI 결과 확인

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # 서버가 새 버전을 확인하는 공개 레포 (appsettings.json 의 Update:Source 와 같아야 한다)
  RELEASE_REPO: Leepy0/Gantt_Scheduler_Release
  # 서명 확인용 공개키 (있을 때만 서명한다)
  UPDATE_KEY: src/GanttScheduler/update-key.pub

jobs:
  package:
    # 테스트 빌드는 main 에 들어간 커밋의 CI 가 성공했을 때만 (PR 에서 돈 CI 로는 만들지 않는다)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # 빌드할 커밋. workflow_run 에서는 GITHUB_SHA 가 main 의 최신 커밋이라 CI 가 검사한 커밋을 따로 쓴다
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0   # 변경 내용용 이전 태그 조회

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: 버전·채널 결정
        id: ver
        run: |
          BASE=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GanttScheduler/GanttScheduler.csproj | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            if [ "$VER" != "$BASE" ]; then
              echo "::error::태그($GITHUB_REF_NAME)와 csproj <Version>($BASE)이 다릅니다. csproj 버전을 올려 커밋한 뒤 그 커밋에 태그를 붙이세요."
              exit 1
            fi
            CH=release
          elif [ "${{ inputs.release }}" = "true" ]; then
            VER="$BASE"
            TAGGED=$(git rev-parse -q --verify "refs/tags/v$VER^{commit}" || true)
            if [ -n "$TAGGED" ] && [ "$TAGGED" != "$SHA" ]; then
              echo "::error::v$VER 태그가 이미 다른 커밋에 있습니다. csproj <Version> 을 올려 커밋한 뒤 다시 실행하세요."
              exit 1
            fi
            CH=release
          else
            VER="$BASE"
            CH=dev
          fi
          # 이 빌드에 든 마지막 DB 마이그레이션 — 서버가 "DB 구조가 바뀌는 업데이트"인지 판단하는 값
          SCHEMA=$(ls src/GanttScheduler/Data/Migrations | grep -E '^[0-9]{14}_.+\.cs$' | grep -v '\.Designer\.cs$' | sort | tail -1 | sed 's/\.cs$//')
          if [ "$CH" = release ]; then ZIP=GanttScheduler-win-x64.zip; else ZIP=GanttScheduler-dev-win-x64.zip; fi
          { echo "ver=$VER"; echo "channel=$CH"; echo "schema=$SCHEMA"; echo "zip=$ZIP"; } >> "$GITHUB_OUTPUT"
          echo "v$VER ($CH), schema=$SCHEMA, commit=${SHA::7}"

      # 정식 배포는 그 커밋의 CI(빌드·SQLite·SQL Server 테스트·화면 점검)가 성공한 것만 내보낸다.
      # 태그·릴리스를 만들기 전에 확인한다. CI 가 아직 돌고 있으면 끝날 때까지 기다린다(최대 40분)
      - name: CI 통과 확인 (정식)
        if: steps.ver.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            STATE=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$SHA" -L 20 --json status,conclusion,url --jq \
              'if any(.[]; .conclusion == "success") then "success" elif any(.[]; .status != "completed") then "running" elif length > 0 then "failed " + .[0].url else "none" end')
            case "$STATE" in
              success) echo "CI 통과: ${SHA::7}"; exit 0 ;;
              running) echo "CI 가 아직 실행 중입니다. 기다립니다… ($i)"; sleep 30 ;;
              failed*) echo "::error::이 커밋(${SHA::7})의 CI 가 실패했습니다. 고친 뒤 다시 정식 배포하세요. ${STATE#failed }"; exit 1 ;;
              *) echo "::error::이 커밋(${SHA::7})의 CI 실행이 없습니다(예: 마이그레이션 워크플로가 만든 커밋). 'gh workflow run ci.yml --ref main' 으로 CI 를 돌린 뒤 다시 정식 배포하세요."; exit 1 ;;
            esac
          done
          echo "::error::CI 가 40분 안에 끝나지 않았습니다. 끝난 뒤 다시 정식 배포하세요."
          exit 1

      # 공개키가 있는 저장소의 정식 배포는 서명이 반드시 있어야 한다 (서버가 서명 없는 업데이트를 받지 않는다)
      - name: 서명 키 확인
        id: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ ! -f "$UPDATE_KEY" ]; then
            echo "공개키 없음 — 서명하지 않는다 (서버의 업데이트 화면에 '서명 검증 꺼짐')"
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_SIGNING_KEY" ]; then
            echo "args=--require-signature --verify-key $UPDATE_KEY" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.ver.outputs.channel }}" = release ]; then
            echo "::error::$UPDATE_KEY 가 있는데 시크릿 RELEASE_SIGNING_KEY 가 없습니다. 이 공개키가 든 서버는 서명 없는 업데이트를 받지 않습니다. README 의 '서명 키'대로 개인키를 시크릿으로 등록한 뒤 다시 실행하세요."
            exit 1
          else
            echo "::warning::시크릿 RELEASE_SIGNING_KEY 가 없어 테스트 빌드에 서명하지 않습니다. 공개키가 든 서버에는 이 파일을 올릴 수 없습니다."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: 패키지 복원 (잠금 파일 그대로)
        run: dotnet restore src/GanttScheduler/GanttScheduler.csproj --locked-mode

      - name: 게시 (win-x64, 런타임 포함)
        run: |
          dotnet publish src/GanttScheduler/GanttScheduler.csproj --no-restore \
            -c Release -r win-x64 --self-contained true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:Version=${{ steps.ver.outputs.ver }} -p:SourceRevisionId=$SHA \
            -p:BuildChannel=${{ steps.ver.outputs.channel }} -p:SchemaId=${{ steps.ver.outputs.schema }} \
            -o publish
          echo "--- web.config"; cat publish/web.config

      # 이전 정식 태그 이후의 커밋 메시지가 변경 내용이 된다 (업데이트 화면에 그대로 보인다)
      - name: 변경 내용
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${SHA}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$SHA"
          git log --no-merges --pretty='tformat:%s%n%n%b' $RANGE | sed -E '/^(Co-Authored-By|Claude-Session):/d' | cat -s > changes.md
          # 공개 레포용 (소스 레포 주소는 넣지 않는다)
          {
            echo "Windows x64 · .NET 런타임 포함"
            echo
            echo "- 이미 설치된 서버: 스스로 업데이트합니다. 바로 바꾸려면 관리 > 업데이트에서 적용하거나, 아래 zip 을 그 화면에 올립니다."
            echo "- 서명을 확인하는 서버에 파일로 올릴 때는 zip 과 GanttScheduler.json, GanttScheduler.json.sig 를 함께 올립니다."
            echo "- 처음 설치: zip 을 풀고 install-service.cmd 를 실행합니다 (README 참고)."
            echo
            cat changes.md
          } > notes-public.md
          {
            cat notes-public.md
            if [ -n "$PREV" ]; then
              echo
              echo "전체 변경: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...v$VER"
            fi
          } > notes.md

      - name: 패키지 (zip · SHA-256 · 매니페스트 · 서명)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 tools/release/pack.py --dir publish --out dist \
            --version "${{ steps.ver.outputs.ver }}" --schema "${{ steps.ver.outputs.schema }}" --rid win-x64 \
            --name "${{ steps.ver.outputs.zip }}" --notes changes.md \
            --page "https://github.com/$RELEASE_REPO/releases/tag/v${{ steps.ver.outputs.ver }}" \
            ${{ steps.sign.outputs.args }}
          ls -la dist

      - name: Release (정식 vX.Y.Z)
        if: steps.ver.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          gh release delete "v$VER" -y 2>/dev/null || true   # 같은 태그로 다시 실행한 경우 (태그는 유지)
          # 태그 push 면 그 태그로, 수동 실행이면 이 커밋에 태그를 만든다
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAGOPT=(--verify-tag); else TAGOPT=(--target "$SHA"); fi
          FILES=(dist/GanttScheduler-win-x64.zip dist/GanttScheduler-win-x64.zip.sha256 dist/GanttScheduler.json)
          [ -f dist/GanttScheduler.json.sig ] && FILES+=(dist/GanttScheduler.json.sig)
          gh release create "v$VER" "${FILES[@]}" "${TAGOPT[@]}" --latest --title "v$VER" --notes-file notes.md

      # 서버가 실제로 보는 곳. 이 단계가 실패하면 서버에는 새 버전이 보이지 않는다
      - name: 공개 배포 레포에 올리기 (정식)
        if: steps.ver.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::시크릿 RELEASE_REPO_TOKEN 이 없어 공개 배포 레포($RELEASE_REPO)에 올리지 못했습니다. 서버에는 v$VER 이 아직 보이지 않습니다. README 의 '새 버전 내보내기'대로 토큰을 등록한 뒤 이 워크플로를 다시 실행하세요."
            exit 1
          fi
          if ! gh api "repos/$RELEASE_REPO" --silent 2> token-error.txt; then
            echo "::error::RELEASE_REPO_TOKEN 으로 $RELEASE_REPO 에 접근하지 못했습니다(만료됐거나 권한 부족). 토큰을 다시 만들어 시크릿을 바꾼 뒤 다시 실행하세요. $(head -c 300 token-error.txt)"
            exit 1
          fi
          gh release delete "v$VER" -R "$RELEASE_REPO" --cleanup-tag -y 2>/dev/null || true
          FILES=(dist/GanttScheduler-win-x64.zip dist/GanttScheduler-win-x64.zip.sha256 dist/GanttScheduler.json)
          [ -f dist/GanttScheduler.json.sig ] && FILES+=(dist/GanttScheduler.json.sig)
          # 실패 이유를 주석으로 남긴다 (토큰에 쓰기 권한이 없으면 여기서 403 이 난다)
          if ! gh release create "v$VER" -R "$RELEASE_REPO" "${FILES[@]}" \
            --latest --title "v$VER" --notes-file notes-public.md 2> create-error.txt; then
            echo "::error::공개 배포 레포($RELEASE_REPO)에 릴리스를 만들지 못했습니다. RELEASE_REPO_TOKEN 에 그 레포의 'Contents: Read and write' 권한이 있는지 확인하세요. 오류: $(head -c 400 create-error.txt | tr '\n' ' ')"
            exit 1
          fi
          # 서버가 읽는 주소로 실제로 받아지는지 확인 (로그인 없이)
          sleep 5
          BASE="https://github.com/$RELEASE_REPO/releases/latest/download"
          curl -sfL "$BASE/GanttScheduler.json" -o public.json || true
          GOT=$(python3 -c "import json; print(json.load(open('public.json', encoding='utf-8'))['version'])" 2>/dev/null || true)
          if [ "$GOT" != "$VER" ]; then
            echo "::error::공개 주소의 매니페스트 버전이 '$GOT' 입니다 (기대: $VER)."
            exit 1
          fi
          # 서명이 있으면 서버와 같은 방법(공개 주소의 파일 + 저장소의 공개키)으로 확인한다
          if [ -f dist/GanttScheduler.json.sig ]; then
            curl -sfL "$BASE/GanttScheduler.json.sig" -o public.json.sig \
              && python3 tools/release/pack.py --check public.json --verify-key "$UPDATE_KEY" \
              || { echo "::error::공개 주소의 매니페스트 서명을 공개키($UPDATE_KEY)로 확인하지 못했습니다."; exit 1; }
          fi
          echo "공개 배포 확인: v$GOT"

      # 테스트 빌드는 항상 같은 주소(dev)로 덮어쓴다
      - name: Release (테스트 dev)
        if: steps.ver.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(dist/GanttScheduler-dev-win-x64.zip dist/GanttScheduler-dev-win-x64.zip.sha256)
          # 서명을 확인하는 서버에 올려 볼 수 있게 배포 정보·서명도 같이 둔다
          [ -f dist/GanttScheduler.json.sig ] && FILES+=(dist/GanttScheduler.json dist/GanttScheduler.json.sig)
          gh release delete dev --cleanup-tag -y 2>/dev/null || true
          gh release create dev "${FILES[@]}" \
            --target "$SHA" --prerelease --title "테스트 빌드 (main)" \
            --notes "commit: ${SHA::7} / run #${GITHUB_RUN_NUMBER} · 자동 업데이트 대상이 아닙니다. 정식 배포는 Latest 릴리스."
